<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the app theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Score Circle / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Score Ring (74% Arc / Resume Score Theme) -->
  <circle
    cx="256"
    cy="256"
    r="180"
    fill="none"
    stroke="#334155"
    stroke-width="28"
    stroke-linecap="round"
  />
  <circle
    cx="256"
    cy="256"
    r="180"
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="28"
    stroke-dasharray="1131"
    stroke-dashoffset="294"
    stroke-linecap="round"
    transform="rotate(-90 256 256)"
    filter="url(#glow)"
  />

  <!-- Document / Resume Icon Base -->
  <path
    d="M 180 140
       L 280 140
       L 332 192
       L 332 372
       A 20 20 0 0 1 312 392
       L 180 392
       A 20 20 0 0 1 160 372
       L 160 160
       A 20 20 0 0 1 180 140 Z"
    fill="#0F172A"
    stroke="#475569"
    stroke-width="8"
  />

  <!-- Document Fold Corner -->
  <path
    d="M 280 140 L 280 192 L 332 192"
    fill="none"
    stroke="#475569"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- Analytics Line Chart Overlaid on Resume -->
  <!-- Line 1: Text Placeholder -->
  <line x1="200" y1="200" x2="250" y2="200" stroke="#64748B" stroke-width="12" stroke-linecap="round" />

  <!-- Sparkline / Trend Line -->
  <path
    d="M 200 320 
       L 235 290 
       L 265 305 
       L 312 245"
    fill="none"
    stroke="url(#accentGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Trend Line Peak Sparkle / AI Node -->
  <circle cx="312" cy="245" r="12" fill="#38BDF8" filter="url(#glow)" />
  
  <!-- AI Sparkle Icon top-right -->
  <path
    d="M 370 120
       Q 370 145 395 145
       Q 370 145 370 170
       Q 370 145 345 145
       Q 370 145 370 120 Z"
    fill="#C084FC"
  />
</svg>
